name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-26-intel
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-26-intel
            target: iOS
            bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
            configure-args: -DSKIP_BUILDING_CODEGEN=OFF

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          combine: true
          target: ${{ matrix.config.target }}
          bindings-ref: ${{ matrix.config.bindings-ref }}
          configure-args: ${{ matrix.config.configure-args }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      # The iOS loader does not support zstd-compressed .geode archives.
      # Pin the combine action and force store/deflate compression.
      - uses: geode-sdk/build-geode-mod/combine@61a56c697aea9655e3f31c6c1b83870431f30434
        id: build
        with:
          zstd: false

      - name: Verify the package uses iOS-readable compression
        run: python3 tools/check-geode-compression.py "${{ steps.build.outputs.build-output }}"

      - name: Verify the package contains every platform binary
        run: python3 tools/check-geode-platforms.py "${{ steps.build.outputs.build-output }}"

      # Publish only after every platform build succeeds. The mod checks
      # version.txt for the newest version and downloads this release asset.
      - name: Publish versioned update
        if: ${{ needs.build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < version.txt)"
          MOD_VERSION="$(python3 -c 'import json; print(json.load(open("mod.json"))["version"])')"
          CMAKE_VERSION="$(python3 -c 'import re; s=open("CMakeLists.txt").read(); m=re.search(r"project\(Afterflow VERSION ([^)]+)\)", s); print(m.group(1) if m else "")')"

          if [[ -z "$VERSION" || "$VERSION" != "$MOD_VERSION" || "$VERSION" != "$CMAKE_VERSION" ]]; then
            echo "Version mismatch: version.txt=$VERSION, mod.json=$MOD_VERSION, CMakeLists.txt=$CMAKE_VERSION" >&2
            exit 1
          fi
          if [[ ! -s "$BUILD_OUTPUT" ]]; then
            echo "Combined .geode package is missing: $BUILD_OUTPUT" >&2
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            ASSET_NAME="$(basename "$BUILD_OUTPUT")"
            if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET_NAME"; then
              echo "Release $VERSION already contains $ASSET_NAME; leaving it unchanged."
            else
              gh release upload "$VERSION" "$BUILD_OUTPUT" --clobber
            fi
          else
            gh release create "$VERSION" "$BUILD_OUTPUT" \
              --title "Afterflow v$VERSION" \
              --notes "Automated release of Afterflow v$VERSION from commit $GITHUB_SHA."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
